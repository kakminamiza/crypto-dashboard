name: trendrider-scan

# สแกน Binance Trend Rider ทุก 1 ชม. เขียน trend_rider_live_cron.html แล้ว push กลับ repo
# (Pages จะ redeploy อัตโนมัติผ่าน pages.yml)
on:
  schedule:
    - cron: "3 * * * *"        # นาทีที่ 3 ของทุกชั่วโมง (เลี่ยงชน radar-scan)
  workflow_dispatch: {}        # กดรันมือได้ที่ Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scanner/requirements.txt

      - name: Run scanner
        run: python scanner/trend_rider_cron.py

      - name: Commit & push snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "trendrider-bot"
          git config user.email "bot@noreply.github.com"
          git add trend_rider_live_cron.html
          if git diff --cached --quiet; then
            echo "no change, skip commit"
          else
            git commit -m "auto: trendrider scan $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
          fi
