name: market-scanners

# รวมสแกนเนอร์คริปโตเข้า GitHub Actions เดียว (ไม่ต้องเปิดเครื่อง):
#  1) radar_scan.py      -> radar_scan.json  (แทน Cloudflare Worker ที่ล่มบ่อย)
#  2) trend_rider_cron.py-> trend_rider_live_cron.html (Trend Rider dashboard)
#  3) notify_tg.py       -> แจ้ง Telegram เมื่อเจอสัญญาณใหม่ (dedup ผ่าน state ใน repo)
# รันทุก 15 นาที + กดมือได้ (workflow_dispatch)
on:
  schedule:
    - cron: "*/15 * * * *"      # ทุก 15 นาที
  workflow_dispatch: {}

permissions:
  contents: write

env:
  MAX_SYMBOLS: "400"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scanner/requirements.txt

      - name: Radar scan (เขียน radar_scan.json)
        run: python scanner/radar_scan.py

      - name: Trend Rider scan (เขียน trend_rider_live_cron.html)
        run: python scanner/trend_rider_cron.py

      - name: Telegram แจ้งเตือนสัญญาณใหม่
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner/notify_tg.py --signals radar_scan.json --state .tg_state_radar.json --source radar
          python scanner/notify_tg.py --signals trend_rider_live_cron_signals.json --state .tg_state_trendrider.json --source trendrider || true

      - name: Commit & push (html + json + state)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "market-bot"
          git config user.email "bot@noreply.github.com"
          git add radar_scan.json trend_rider_live_cron.html .tg_state_radar.json .tg_state_trendrider.json
          if git diff --cached --quiet; then
            echo "no change, skip commit"
          else
            git commit -m "auto: market scan $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
          fi
