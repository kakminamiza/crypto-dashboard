name: radar-scan
on:
  schedule:
    - cron: "*/10 * * * *"   # ทุก 10 นาที สแกน Bybit ทั้งกระดานผ่าน Cloudflare Worker
  workflow_dispatch: {}       # กดรันมือได้

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan via Cloudflare Worker (refresh) + fetch result
        run: |
          set -e
          WORKER="https://futures-radar-worker.futures-radar-worker.workers.dev"
          echo "Triggering worker scan..."
          curl -s -m 90 "$WORKER/api/radar/refresh" -o radar_scan_raw.json || true
          curl -s -m 30 "$WORKER/api/radar" -o radar_scan.json || cp radar_scan_raw.json radar_scan.json
          echo "Result size: $(wc -c < radar_scan.json) bytes"
          echo "Symbols found: $(grep -o '"symbol"' radar_scan.json | wc -l)"

      - name: Commit scan result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "radar-bot"
          git config user.email "bot@noreply.github.com"
          git add radar_scan.json
          if git diff --cached --quiet; then
            echo "no change, skip commit"
          else
            git commit -m "auto: radar scan $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push https://x-access-token:${GITHUB_TOKEN}@github.com/kakminamiza/crypto-dashboard.git HEAD:main
          fi
