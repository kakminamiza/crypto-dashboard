<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Scanner - Dip-Buy Multi-Agent</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#222b36;--txt:#c9d1d9;--muted:#7d8590;
        --ok:#3fb950;--warn:#d29922;--bad:#f85149;--accent:#58a6ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  h1{font-size:15px;margin:0;color:var(--accent);font-weight:600}
  .sub{color:var(--muted);font-size:12px}
  .controls{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,select,button{background:var(--panel);color:var(--txt);border:1px solid var(--line);
        border-radius:6px;padding:6px 10px;font-size:13px}
  button{cursor:pointer;color:var(--accent)}
  button:hover{border-color:var(--accent)}
  main{padding:16px;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .sym{font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:center}
  .badge{padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
  .b-buy{background:rgba(63,185,80,.15);color:var(--ok);border:1px solid var(--ok)}
  .b-watch{background:rgba(210,153,34,.12);color:var(--warn);border:1px solid var(--warn)}
  .b-no{background:rgba(248,81,73,.10);color:var(--bad);border:1px solid var(--bad)}
  .row{display:flex;justify-content:space-between;margin:4px 0;font-size:12px}
  .row span:first-child{color:var(--muted)}
  .thesis{margin-top:8px;font-size:11px;color:var(--muted);white-space:pre-wrap;
        border-top:1px dashed var(--line);padding-top:8px;display:none}
  .card.open .thesis{display:block}
  .err{color:var(--bad);font-size:11px}
  .pos{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
  .pos input{width:90px}
  footer{padding:12px 18px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}
  .tab{padding:4px 10px;cursor:pointer;border:1px solid var(--line);border-radius:6px;color:var(--muted)}
  .tab.on{color:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>
<header>
  <div>
    <h1>🔍 Signal Scanner</h1>
    <div class="sub">Dip-Buy Multi-Agent · Binance Futures · client-side (anti-ban)</div>
  </div>
  <div class="controls">
    <span class="tab on" id="tab-scan" onclick="switchTab('scan')">Scan</span>
    <span class="tab" id="tab-pos" onclick="switchTab('pos')">Position Watch</span>
    <span class="tab" id="tab-score" onclick="switchTab('score')">Score Trade</span>
  </div>
</header>

<section id="scan-pane">
  <div class="controls" style="padding:12px 18px">
    <input id="sym" value="BTCUSDT,ETHUSDT,ETHFIUSDC,CRVUSDT,BEATUSDT" size="38">
    <select id="tf"><option>5m</option><option>15m</option><option selected>1h</option><option>4h</option><option>1d</option></select>
    <label style="font-size:12px;color:var(--muted)"><input type="checkbox" id="usellm"> LLM thesis</label>
    <select id="model"><option value="qwen2.5:3b">qwen2.5:3b</option><option value="qwen2.5:7b">qwen2.5:7b</option><option value="qwen2.5vl:7b">qwen2.5vl:7b</option><option value="granite3.3:latest">granite3.3</option></select>
    <button onclick="scan()">Scan</button>
    <button onclick="scanAll()">Scan All USDT</button>
    <button id="autoBtn" onclick="toggleAuto()">▶ Auto</button>
  </div>
  <main id="grid"></main>
</section>

<section id="pos-pane" style="display:none;padding:16px">
  <div class="controls" style="margin-bottom:12px">
    <input id="psym" placeholder="BTCUSDT" size="12">
    <select id="ptf"><option>5m</option><option>15m</option><option selected>1h</option><option>4h</option></select>
    <input id="psup" placeholder="support" size="10">
    <input id="psl" placeholder="SL" size="10">
    <button onclick="addPos()">Add Watch</button>
    <button onclick="checkPos()">Check Now</button>
  </div>
  <div id="poslist"></div>
</section>

<section id="score-pane" style="display:none;padding:16px;max-width:520px">
  <h3 style="font-size:14px;margin-top:0">Post-Trade Score Sheet</h3>
  <div class="controls" style="margin-bottom:10px">
    <input id="ssym" placeholder="BTCUSDT" size="10">
    <select id="stf"><option>5m</option><option>15m</option><option selected>1h</option><option>4h</option></select>
    <input id="spnl" placeholder="PNL %" size="8">
  </div>
  <div id="factors"></div>
  <button onclick="saveScore()" style="margin-top:10px">Save Score</button>
  <div id="scoreresult" style="margin-top:10px;color:var(--muted);font-size:12px"></div>
  <div id="scorehistory" style="margin-top:14px"></div>
</section>

<footer id="foot">Idle.</footer>
<script src="scanner_logic.js"></script>
</body>
</html>
