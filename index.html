<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accumulation Scanner Dashboard</title>
<style>
  :root {{ --bg:#0d1117; --card:#161b22; --fg:#e6edf3; --mut:#8b949e;
          --grn:#3fb950; --red:#f85149; --blu:#58a6ff; --bd:#30363d; }}
  * {{ box-sizing:border-box; }}
  body {{ margin:0; background:var(--bg); color:var(--fg);
          font-family:"Segoe UI",Tahoma,Roboto,sans-serif; }}
  header {{ padding:16px 20px; border-bottom:1px solid var(--bd); }}
  h1 {{ margin:0; font-size:18px; }}
  .sub {{ color:var(--mut); font-size:12px; margin-top:4px; }}
  .grid {{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
           gap:12px; padding:16px 20px; }}
  .card {{ background:var(--card); border:1px solid var(--bd); border-radius:10px;
           padding:14px; position:relative; }}
  .sym {{ font-size:15px; font-weight:700; color:var(--blu); }}
  .price {{ font-size:22px; font-weight:700; margin:6px 0; }}
  .row {{ display:flex; justify-content:space-between; font-size:12px;
          color:var(--mut); margin:3px 0; }}
  .chg.up {{ color:var(--grn); }} .chg.down {{ color:var(--red); }}
  svg.spark {{ display:block; margin-top:8px; }}
  .tip {{ position:absolute; background:#000; color:#fff; font-size:11px;
          padding:4px 7px; border-radius:5px; pointer-events:none; opacity:0;
          transition:opacity .1s; white-space:nowrap; z-index:9; }}
  .mtf {{ display:flex; gap:3px; margin-top:8px; }}
  .mtf .t {{ font-size:9px; padding:2px 4px; border-radius:4px; font-weight:700; }}
  .mtf .BULL {{ background:var(--grn); color:#000; }}
  .mtf .BEAR {{ background:var(--red); color:#000; }}
  .mtf .NEUTRAL {{ background:var(--bd); color:var(--mut); }}
  .badge {{ display:inline-block; font-size:10px; padding:2px 6px; border-radius:4px;
            background:var(--bd); color:var(--fg); margin-left:6px; }}
  footer {{ padding:12px 20px; color:var(--mut); font-size:11px; border-top:1px solid var(--bd); }}
</style>
</head>
<body>
<header>

</header>
<div class="grid" id="grid"></div>
<footer>สแกนโดย Binance Spot API + CoinGecko trending &middot; Static file เปิดได้โดยไม่ต้อง server</footer>
<div class="tip" id="tip"></div>

DATA.forEach(r => {{

  const chgTxt = (r.chg===null) ? '-' : (r.chg>=0?'+':'') + r.chg + '%';
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `

      <path d="${r.spark}" fill="none" stroke="#58a6ff" stroke-width="1.5"/>

    <div class="mtf">${Object.entries(r.mtf).map(([tf,s])=>`<span class="t ${s}">${tf}</span>`).join('')}</div>`;

    tip.style.top = (e.pageY + 12) + 'px';
  }});
  card.addEventListener('mouseleave', () => tip.style.opacity = 0);
  grid.appendChild(card);
}});
</script>
</body>
</html>
