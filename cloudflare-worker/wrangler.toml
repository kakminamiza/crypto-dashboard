name = "futures-radar-worker"
main = "src/index.js"
compatibility_date = "2025-08-01"

# Cron: รันทุก 1 นาที
[triggers]
crons = ["* * * * *"]

# KV Namespace — สร้างก่อนด้วย: wrangler kv namespace create SIGNAL_KV
# แล้ววาง ID ที่ได้ลงที่นี่
[[kv_namespaces]]
binding = "SIGNAL_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
